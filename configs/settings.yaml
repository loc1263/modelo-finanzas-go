# Configuracion general del pipeline

database:
  path: "data/modelo_finanzas.db"

output:
  html_dir: "output"
  # Reportes con mas de este numero de dias se borran solos en cada corrida
  # (reporte_ultimo.html nunca se toca). <= 0 desactiva el borrado.
  retention_days: 30

logging:
  dir: "logs"
  # Se le agrega la fecha (pipeline_2026-10-02.log); logs con mas de este
  # numero de dias se borran solos en cada corrida. <= 0 desactiva el borrado.
  file: "pipeline.log"
  retention_days: 30

universe:
  vanguard_etfs_csv: "configs/vanguard_etfs.csv"
  megacap_stocks_csv: "configs/megacap_stocks.csv"

yahoo:
  # Pausa entre requests a la API gratuita de Yahoo para no bloquearla.
  request_pause_ms: 1500
  max_retries: 3
  retry_backoff_ms: 5000
  timeout_seconds: 20
  # Anios de historia diaria a descargar (se necesitan ~36 meses para el
  # momentum residual, mas margen para el calculo de 52 semanas y vol).
  history_years: 6
  # Tickers descargados en paralelo (cada worker igual respeta su propia
  # pausa de arriba). 1 = secuencial. Subir esto acerca el ritmo total de
  # requests a Yahoo a concurrency/request_pause_ms — mantenerlo chico.
  concurrency: 2

famafrench:
  # Datasets de la Kenneth R. French Data Library (formato mensual).
  research_factors_3: "F-F_Research_Data_Factors"
  research_factors_5: "F-F_Research_Data_5_Factors_2x3"
  momentum_factor: "F-F_Momentum_Factor"

models:
  lookback_months_long: 12
  lookback_months_short: 6
  # Modelo 2 (maximo 52 semanas): ventana en dias de trading (~252 = 1 anio).
  max52w_lookback_days: 252
  # Modelo 3 (momentum ajustado por volatilidad): ventana para la vol anualizada.
  voladjusted_vol_lookback_days: 252
  # Modelo 4 (momentum residual): ventana de regresion OLS y meses de residuos.
  residual_regression_window_months: 36
  residual_momentum_months: 12
  # Modelo 5 (escalado por volatilidad): objetivo anual y ventana de vol realizada.
  vol_scaling_target_vol_annual: 0.12
  vol_scaling_lookback_days: 126
  # Modelo 6 (momentum acelerado): meses del tramo corto vs lookback_months_long.
  accel_short_months: 3
